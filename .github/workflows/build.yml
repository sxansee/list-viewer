name: Build APK

# Every push builds the app and keeps the APK for 30 days (Actions, open the run, section Artifacts).
# A release is made from a version tag, and every release is a separate entry under Releases:
#
#     git tag v2.2.0
#     git push origin v2.2.0
#
# It can also be started by hand: Actions, Build APK, Run workflow, with the version filled in (for example 2.2.0).
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 2.2.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - name: Work out the version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release=false
          version=""
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            release=true
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            release=true
            version="${INPUT_VERSION#v}"
          fi
          if [[ "$release" == true ]] && ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version number such as 2.2.0 or 2.3.0-beta.1"
            exit 1
          fi
          # A version with a suffix (2.3.0-beta.1) is published as a pre-release and never becomes "Latest".
          pre=false
          latest=true
          if [[ "$version" == *-* ]]; then
            pre=true
            latest=false
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "pre=$pre"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Errors summary
        if: failure()
        shell: bash
        run: |
          { echo '### Build errors'; echo '```'; grep -E "^e: |error:|What went wrong|Execution failed" -A4 build.log | head -120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with: { name: build-log, path: build.log }

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk List.apk

      - name: Keep the APK of this build
        if: steps.ver.outputs.release != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: List-apk
          path: List.apk
          retention-days: 30

      - name: Publish a release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: List ${{ steps.ver.outputs.version }}
          body: |
            Download **List.apk** and install it on your phone (Android 7.0 or newer).
          generate_release_notes: true
          files: List.apk
          fail_on_unmatched_files: true
          prerelease: ${{ steps.ver.outputs.pre }}
          make_latest: ${{ steps.ver.outputs.latest }}
