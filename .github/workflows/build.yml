name: Build APK

# Every push builds the app and keeps the APK for 30 days (Actions, open the run, section Artifacts).
# A release is made from a version tag, and every release is a separate entry under Releases:
#
#     git tag v2.5.0
#     git push origin v2.5.0
#
# A tag with a suffix (v2.5.0-beta.1) makes a pre-release: it is shown as such and never becomes "Latest", so it is the way to
# try a new version on a phone first. The release notes are taken from the section of the same version in CHANGELOG.md.
#
# The APK is the optimised (release) build. If the optimiser ever fails, the plain debug build is made instead and the run
# shows a warning, so that a problem there never leaves the repository without an APK.
#
# The APK is signed with the public key from the repository (app/debug.keystore) unless a key of your own is set up:
# tools/New-ReleaseKey.ps1 makes one, and the repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD (optionally KEY_ALIAS,
# KEY_PASSWORD) hand it to this workflow. The run page says which key signed the APK.
#
# It can also be started by hand: Actions, Build APK, Run workflow, with the version filled in (for example 2.5.0).
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 2.5.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17, cache: gradle }

      - name: Work out the version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release=false
          version=""
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            release=true
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            release=true
            version="${INPUT_VERSION#v}"
          fi
          if [[ "$release" == true ]] && ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version number such as 2.5.0 or 2.5.0-beta.1"
            exit 1
          fi
          # A version with a suffix (2.5.0-beta.1) is published as a pre-release and never becomes "Latest".
          pre=false
          latest=true
          if [[ "$version" == *-* ]]; then
            pre=true
            latest=false
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "pre=$pre"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare the signing key
        id: key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "own=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Signing key'
              echo 'This APK is signed with the **public key from the repository**: no key of your own is set up (see tools/New-ReleaseKey.ps1).'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error title=Signing key::The secret KEYSTORE_BASE64 is set, but the secret KEYSTORE_PASSWORD is not."
            exit 1
          fi
          store="$RUNNER_TEMP/list-release.p12"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$store" 2>/dev/null || [[ ! -s "$store" ]]; then
            echo "::error title=Signing key::The secret KEYSTORE_BASE64 is not valid base64. Paste the whole text that New-ReleaseKey.ps1 put on the clipboard, with nothing added."
            exit 1
          fi
          alias="${KEY_ALIAS:-list}"
          if ! listing=$(keytool -list -keystore "$store" -storepass "$KEYSTORE_PASSWORD" -alias "$alias" 2>&1); then
            echo "::error title=Signing key::The key could not be opened. Check the secrets KEYSTORE_PASSWORD and KEY_ALIAS (the alias is list unless you chose another one)."
            echo "$listing" | head -n 5
            exit 1
          fi
          fingerprint=$(echo "$listing" | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -n 1 || true)
          {
            echo "LIST_KEYSTORE=$store"
            printf 'LIST_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            echo "LIST_KEY_ALIAS=$alias"
            printf 'LIST_KEY_PASSWORD=%s\n' "${KEY_PASSWORD:-}"
          } >> "$GITHUB_ENV"
          {
            echo "own=true"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Signing key'
            echo "This APK is signed with **your own key**. SHA-256 of its certificate: \`$fingerprint\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Optimised build failed::The release (R8) build failed, so this APK is the plain debug build, which feels slower. Open the Errors summary of this run."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
          fi

      - name: Errors summary
        if: failure() || steps.build.outputs.variant == 'debug'
        shell: bash
        run: |
          {
            echo '### Build errors'
            for f in build.log build-debug.log; do
              if [[ -f "$f" ]]; then
                echo "**$f**"
                echo '```'
                { grep -E "^e: |error:|What went wrong|Execution failed|Missing class|R8:" -A4 "$f" | head -100; } || true
                echo '```'
              fi
            done
            missing=app/build/outputs/mapping/release/missing_rules.txt
            if [[ -f "$missing" ]]; then
              echo '**Classes R8 could not find (the rules it suggests)**'
              echo '```'
              head -60 "$missing"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: |
            build.log
            build-debug.log
            app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore

      - name: Prepare APK
        shell: bash
        env:
          VARIANT: ${{ steps.build.outputs.variant }}
        run: |
          set -euo pipefail
          apk=$(find "app/build/outputs/apk/$VARIANT" -name '*.apk' | head -n 1)
          if [[ -z "$apk" ]]; then
            echo "::error::No APK was found in app/build/outputs/apk/$VARIANT"
            exit 1
          fi
          cp "$apk" List.apk
          ls -l List.apk

      # With a key of your own the APK must carry exactly that key: an APK signed with another one would not install over the
      # previous version on the phone, so the run stops here instead of publishing it.
      - name: Check the signature of the APK
        shell: bash
        env:
          OWN: ${{ steps.key.outputs.own }}
          EXPECTED: ${{ steps.key.outputs.fingerprint }}
        run: |
          set -uo pipefail
          apksigner=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$apksigner" ]]; then
            echo "apksigner was not found on this runner, the signature is not checked."
            exit 0
          fi
          if ! certs=$("$apksigner" verify --print-certs List.apk 2>&1); then
            echo "::warning title=Signature::apksigner could not verify List.apk."
            echo "$certs" | head -n 5
            exit 0
          fi
          digest=$(echo "$certs" | grep -m1 'SHA-256 digest' | sed 's/.*: *//' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Signed with the certificate $digest"
          if [[ "$OWN" == "true" && "$digest" != "$EXPECTED" ]]; then
            echo "::error title=Signature::The APK is not signed with your key (expected $EXPECTED, found $digest)."
            exit 1
          fi
          echo "SHA-256 of the certificate in List.apk: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK of this build
        if: steps.ver.outputs.release != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: List-apk
          path: List.apk
          retention-days: 30

      - name: Write the release notes
        if: steps.ver.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VARIANT: ${{ steps.build.outputs.variant }}
        run: |
          set -euo pipefail
          base="${VERSION%%-*}"
          {
            echo "Download **List.apk** and install it on your phone (Android 7.0 or newer). It installs over the previous version and keeps your list."
            echo
            if [[ "$VERSION" == *-* ]]; then
              echo "> **Pre-release.** This is a version to try first. The release without a suffix in its name is the one for everyday use."
              echo
            fi
            if [[ "$VARIANT" != "release" ]]; then
              echo "> This APK is the plain debug build (the optimised build failed in this run), so it may feel slower."
              echo
            fi
            if [[ -f CHANGELOG.md ]]; then
              awk -v v="$base" '/^## / { if (on) exit; if ($2 == v) on = 1; next } on { print }' CHANGELOG.md
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish a release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: List ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: List.apk
          fail_on_unmatched_files: true
          prerelease: ${{ steps.ver.outputs.pre }}
          make_latest: ${{ steps.ver.outputs.latest }}

  # The unit tests (app/src/test) check the parts of the app that need no phone: the list and its folders, backups,
  # sorting and file names. They run next to the build and never stop a release: a failure is shown as a warning
  # on the run page, and the test report is kept in the run's Artifacts.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17, cache: gradle }

      - name: Run the unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Say so when a test failed
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Unit tests::Some unit tests failed. The APK is not affected. See the test-report artifact of this run."
          { echo '### Unit tests failed'; echo '```'; grep -E "FAILED|AssertionError|What went wrong|^e: " -A3 test.log | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            test.log
          if-no-files-found: ignore
          retention-days: 14

  # Android Lint looks for what the compiler does not see: texts without a translation, resources nobody uses, calls that
  # are deprecated and so on. It only reports: a finding never stops a build or a release. The count is written on the run
  # page and the full report is kept in the run's Artifacts (lint-report).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17, cache: gradle }

      - name: Run Android Lint
        continue-on-error: true
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee lint.log

      - name: Write the result on the run page
        if: always()
        shell: bash
        run: |
          xml=app/build/reports/lint-results-debug.xml
          if [[ -f "$xml" ]]; then
            errors=$(grep -c 'severity="Error"' "$xml" || true)
            warnings=$(grep -c 'severity="Warning"' "$xml" || true)
            {
              echo "### Android Lint: ${errors:-0} errors, ${warnings:-0} warnings"
              echo 'The full report is in the Artifacts of this run (lint-report).'
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "${errors:-0}" != "0" ]]; then
              echo "::warning title=Android Lint::Lint found ${errors} errors. The APK is not affected. See the lint-report artifact of this run."
            fi
          else
            echo '### Android Lint did not produce a report' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            lint.log
          if-no-files-found: ignore
          retention-days: 14
