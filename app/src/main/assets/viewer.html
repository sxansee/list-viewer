<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#e6ecec;--fg:#1c2424;--card:#fff;--ac:#0b6e6e;--mu:#5d6767}
body.d{--bg:#0e1515;--fg:#dde4e4;--card:#18201f;--ac:#5ccfcf;--mu:#9aa5a4}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
a{color:var(--ac)}
#m{padding:32px 20px;text-align:center;color:var(--mu)}
#m.err{color:#c62828;text-align:left}
body.d #m.err{color:#ef9a9a}
#n{margin:8px 12px;padding:8px 12px;border-radius:12px;background:var(--card);font-size:14px;color:var(--mu)}
#bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg)}
#bar:empty{display:none}
#bar button{border:0;border-radius:16px;padding:7px 14px;background:var(--card);color:var(--fg);font:inherit;font-size:14px;white-space:nowrap}
#bar button.a{background:var(--ac);color:#fff}
.r{max-width:42em;margin:0 auto;padding:12px 16px 48px;overflow-wrap:break-word}
.r img,.r svg{max-width:100%;height:auto}
.r table{white-space:normal}
.t{margin:0;padding:12px 16px 48px;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,monospace}
.docx-wrapper{background:transparent!important;padding:8px!important}
.docx-wrapper>section.docx{box-shadow:0 1px 8px #0004;margin-bottom:10px!important}
table{border-collapse:collapse;background:var(--card);color:var(--fg);font-size:13px;margin:8px 12px}
tr:first-child td{font-weight:600}
td,th{border:1px solid #8886;padding:3px 8px;white-space:nowrap;vertical-align:top}
.sl{margin:14px 0;padding-bottom:6px;border-bottom:1px solid #8884}
.sl h4{margin:0 0 6px;color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #8883}
.row b{font-weight:500;word-break:break-all}.row span{color:var(--mu);white-space:nowrap;font-size:13px}
.i{display:block;max-width:100%;height:auto;margin:0 auto}
.ta{color:var(--mu);font-style:italic}.st{margin:.6em 0 .6em 1.2em}
.k{color:#2a7ab0}.s{color:#2e7d32}.b{color:#b0562a}.z{color:#888}.nu{color:#8e24aa}
body.d .k{color:#79b8e8}body.d .s{color:#8bc34a}body.d .b{color:#ffab70}body.d .nu{color:#ce93d8}
</style>
<div id="m">Открываю файл…</div><div id="n" hidden></div><div id="bar"></div><div id="c"></div>
<script src="viewer.js"></script>
